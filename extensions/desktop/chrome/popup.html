<!DOCTYPE html>
<html>
<head>
  <title>Cookie Checker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 10px;
      width: 300px;
    }
    #cookieList {
      max-height: 400px;
      overflow-y: auto;
      word-wrap: break-word;
    }
    .cookie {
      margin-bottom: 10px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background-color: #f9f9f9;
    }
    .cookie strong {
      display: block;
      margin-bottom: 5px;
    }
  </style>
  <script src="popup.js" defer></script>
</head>
<body>
  <h1>Cookie Checker</h1>
  <button id="check">Check Cookies</button>
  <button id="download">Download Cookies</button>
  <div id="cookieList"></div>
</body>
</html>
