<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Cookie Preferences</title>
    <link rel="stylesheet" href="./css/button-toggle.css">
</head>
<body>
    <div class="container">
        <!-- <h1>Your Cookie Preferences</h1> -->
        <!-- <p class="description">
            Below are the cookie preferences that have been saved in your browser. These settings show whether you've 
            accepted or rejected cookies for different websites you've visited and the cookie's expiration date.
        </p> -->

        <div id="loading">Loading your cookie preference data...</div>

        <!-- Combined Table with Both Most and Least Visited Websites -->
        <div id="page1">
            <!-- <div style="padding: 10px; margin-bottom: 15px; text-align: center;">
                <span style="font-size: 16px;">The </span>
                <span style="color: #ff9800; font-weight: bold; font-size: 25px;">!</span>
                <span style="font-size: 16px;"> next to a choice indicates there was a difference between the choice you made earlier and the actual cookies consent preference in your history.</span>
            </div> -->
            <table id="mostRecentTable" style="display: none;">
            <thead>
                <tr>
                    <th class="website-cell">Website</th>
                    <th>Extra Functionality Cookies</th>
                    <th>Performance Cookies</th>
                    <th>Personalized Advertising Cookies</th>
                    <th>Cookie Settings Will Be Stored For:</th>
                </tr>
            </thead>
            <tbody id="mostRecentWebsitesList">
                <!-- Most frequently visited websites will be inserted here by JS -->
            </tbody>
            <!-- Section divider row -->
            <!-- <tbody>
                <tr>
                    <td colspan="5" class="section-divider">Least Frequently Visited Websites</td>
                </tr>
            </tbody> -->
            <tbody id="leastRecentWebsitesList">
                <!-- Least frequently visited websites will be inserted here by JS -->
            </tbody>
        </table>
    </div>
    <script src="consent_history_and_discrepancies.js"></script>
    <script src="ext-shim.js"></script>
    <script>
      (function () {
        const elementId = "pricrumbs_consent_history_top_websites";
        let rafId = null;

        function postHeight() {
          const root = document.documentElement;
          const body = document.body;
          const height = Math.max(
            root ? root.scrollHeight : 0,
            body ? body.scrollHeight : 0
          );

          if (window.parent && height > 0) {
            window.parent.postMessage(
              {
                type: "PRICRUMBS_EMBED_HEIGHT",
                payload: { elementId, height }
              },
              "*"
            );
          }
        }

        function scheduleHeightPost() {
          if (rafId !== null) {
            cancelAnimationFrame(rafId);
          }
          rafId = requestAnimationFrame(() => {
            rafId = null;
            postHeight();
          });
        }

        window.addEventListener("load", scheduleHeightPost);
        window.addEventListener("resize", scheduleHeightPost);

        const observer = new MutationObserver(scheduleHeightPost);
        observer.observe(document.documentElement, {
          childList: true,
          subtree: true,
          attributes: true,
          characterData: true
        });

        setTimeout(scheduleHeightPost, 100);
        setTimeout(scheduleHeightPost, 500);
        setTimeout(scheduleHeightPost, 1200);

        const intervalId = setInterval(scheduleHeightPost, 500);
        setTimeout(() => clearInterval(intervalId), 10000);
      })();
    </script>
</body>
</html>
