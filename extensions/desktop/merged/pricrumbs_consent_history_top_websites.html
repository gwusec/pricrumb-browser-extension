<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Cookie Preferences</title>
    <!-- <link rel="stylesheet"  href="/css/button-toggle.css"> -->
</head>
<body>
    <div class="container">
        <div id="loading">Loading your cookie preference data...</div>

        <!-- Combined Table with Both Most and Least Visited Websites -->
        <div id="page1">
            <table id="mostRecentTable" style="display: none;">
            <thead>
                <tr>
                    <th class="website-cell">Website</th>
                    <th>Extra Functionality Cookies</th>
                    <th>Performance Cookies</th>
                    <th>Personalized Advertising Cookies</th>
                    <th>Cookie settings will be stored for:</th>
                </tr>
            </thead>
            <tbody id="mostRecentWebsitesList">
                <!-- Most frequently visited websites will be inserted here by JS -->
            </tbody>
            <tbody id="leastRecentWebsitesList">
                <!-- Least frequently visited websites will be inserted here by JS -->
            </tbody>
        </table>
    </div>
    <script type="module" src="consent_history_and_discrepancies.js"></script>
    <script src="ext-shim.js"></script>
    </body>
</html>
