<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <title>RQ3</title> -->
    <style>
        /* EMBED-FRIENDLY: don't touch the host page background or add global padding */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
            padding: 0;              /* was 20px */
            margin: 0;
            line-height: 1.6;
            background-color: transparent;  /* was #f5f5f5 */
        }

        /* EMBED-FRIENDLY: let the host decide the width; no fixed max-width or centering */
        .container {
            width: 100%;
            max-width: 100%;         /* was max-width: 800px */
            margin: 0;               /* was margin: 0 auto; */
            background-color: #fff;
            border-radius: 0;        /* remove card styling if you want it flat; change if you prefer */
            box-shadow: none;        /* remove extra shadow inside survey card */
            padding: 0;              /* was 20px; keeps the panel tight */
        }

        h1, h2 {
            color: #444;
            text-align: center;
            margin-top: 0;
        }

        h2 {
            font-size: 1.2rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .section {
            margin-bottom: 0;
            padding: 15px;
            border-radius: 5px;
            background-color: #fff;
            /* border-left: 4px solid #007bff; */
        }

        .website-card:hover {
            transform: translateY(-3px);
        }

        .website-header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            background-color: #fff;
            padding: 8px 12px;
            border-radius: 4px;
        }

        .favicon {
            /* width: 16px;
            height: 16px; */
            margin-right: 10px;
        }

        .website-header h3 {
            margin: 0;
            font-size: 1.35rem;
            color: #333;
            text-align: center;
        }

        .website-details {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 10px;
        }

        .website-details p {
            margin: 5px 0;
        }

        .cookie-preferences {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .preference {
            display: flex;
            justify-content: space-between;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .status {
            font-weight: bold;
        }

        #loadingView {
            text-align: center;
            padding: 50px 0;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            color: #f44336;
            font-weight: bold;
        }

        .no-data {
            font-style: italic;
            color: #999;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- <h1>Correaltions between the factors and users choices</h1> -->
        
        <!-- Loading View -->
        <div id="loadingView">
            <div class="spinner"></div>
            <!-- <p>Cookie choices basaed on 3 critirias</p> -->
        </div>
        
        <!-- Websites View -->
        <div id="websitesView" style="display: none;">
            <!-- <p class="introduction">
                Based on your browsing history and cookie preferences, we've identified patterns in how you interact with different types of websites. Here's what we found:
            </p> -->
            
            <!-- <div class="analysis-header">Websites where all cookie types has been accepted:</div> -->
            <div id="category3" class="section"></div>
            
            <!-- <div class="analysis-header">Websites where all cookie types has been rejected:</div>
            <div id="category2" class="section"></div>
            
            <div class="analysis-header">Websites with mixed preferences (Accept Functional & Performance, Reject Advertising):</div>
            <div id="category3" class="section"></div> -->
            
            <!-- <button id="backButton" class="button">Back to Main</button> -->
        </div>
    </div>
    <!-- <script>
        // Tell the JavaScript which page type we're on
        window.categoryType = 'mixed';
    </script> -->
    
    <script src="measure_factores_seperate_pages.js"></script>
    <script src="ext-shim.js"></script>
</body>
</html>
