services:
  domain-hash-api:
    image: node:20-alpine
    working_dir: /app
    command: ["node", "hash_service.js"]
    environment:
      PORT: "3000"
      DOMAIN_HMAC_KEY_FILE: "/run/secrets/domain_hmac.key"
      MAX_DOMAINS_PER_REQUEST: "5000"
      MAX_BODY_BYTES: "1048576"
    volumes:
      - ./hash_service.js:/app/hash_service.js:ro
      - ./secrets/domain_hmac.key:/run/secrets/domain_hmac.key:ro
    expose:
      - "3000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - domain-hash-api
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
